# Hermas Data Services — Data Cleanup Pipeline Configuration

service:
  name: "Mr Bubba Data Cleanup Service"
  price: 75.00
  currency: "USD"
  email: "mrbubba@agentmail.to"
  api_key: "am_us_inbox_ec1c165f585ed00f28e1a6d17a4ddf198193d215e4c7fa9d8bcc9f6c2b3275e7"

cleaning:
  fuzzy_duplicate_threshold: 0.9
  date_output_format: "%Y-%m-%d"
  phone_format: "US"
  remove_empty_rows: true
  remove_empty_columns: true
  supported_formats:
    - ".csv"
    - ".xlsx"
    - ".xls"
    - ".txt"
    - ".tsv"

payments:
  paypal_client_id: "${PAYPAL_CLIENT_ID}"
  paypal_client_secret: "${PAYPAL_CLIENT_SECRET}"
  paypal_base_url: "https://api-m.sandbox.paypal.com"
  currency: "USD"
  terms: "Payment due within 7 days"

notifications:
  discord_enabled: true
  discord_webhook_url: "${DISCORD_WEBHOOK_URL}"
  notify_on_cleanup: true
  notify_on_payment: true
  notify_on_invoice_created: true
  notify_on_overdue: true
  notify_weekly_summary: true
  weekly_summary_day: "monday"
  weekly_summary_hour: 9

pipeline:
  poll_interval_seconds: 60
  max_file_size_mb: 50
  retry_on_error: true
  max_retries: 3
  daemon_mode: true

logging:
  level: "INFO"
  log_to_file: true
  log_directory: "logs"
  max_log_size_mb: 10
  backup_count: 5
